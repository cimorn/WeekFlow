[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "WeekFlow"
version = "26.07.04"
description = "WeekFlow desktop app for editing and generating weekly report JSON/Markdown pairs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["markdown>=3.7,<4", "PySide6>=6.8,<7", "volcengine-python-sdk[ark]>=4.0.0"]
license = {file = "LICENSE"}

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "pyinstaller>=6.0,<7"]

[project.scripts]
weekflow = "WeekFlow.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
